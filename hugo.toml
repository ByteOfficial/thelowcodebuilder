baseURL = "https://thelowcodebuilder.com/"
languageCode = "en-us"
title = "The Low Code Builder"
theme = "PaperMod"
paginate = 10
enableGitInfo = true

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[taxonomies]
category = "categories"
tag = "tags"

[params]
env = "production"
description = "Power Platform Tips Tutorials and Insights"
author = "Kunal Kumar"
ShowShareButtons = true
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
comments = true
ShowCodeCopyButtons = true
defaultTheme = "dark"
hidePoweredBy = true
keywords = ["Power Apps", "Power Automate", "Power BI", "Power Pages", "Microsoft Power Platform", "Low Code"]

[params.homeInfoParams]
Title = "Welcome to The Low Code Builder"
Content = "Your go-to resource for Microsoft Power Platform - Power Apps, Power Automate, Power BI and Power Pages"

[params.assets]
favicon = "/favicon.ico"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
apple_touch_icon = "/apple-touch-icon.png"

[[params.socialIcons]]
name = "linkedin"
url = "https://linkedin.com/in/kunal0"

