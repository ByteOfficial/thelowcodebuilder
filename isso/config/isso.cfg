[general]
dbpath = /db/comments.db
; Add your site's domain(s) — required for CORS
host =
    https://thelowcodebuilder.com
    https://www.thelowcodebuilder.com
    http://localhost:1313
max-age = 15m
notify = stdout
log-file =

[moderation]
enabled = true
purge-after = 30d

[admin]
enabled = true
password = changeme-use-a-strong-password

[guard]
enabled = true
; Max comments per visitor per thread
ratelimit = 2
; Require author name
require-author = true
; Max top-level comments per thread per visitor
direct-reply = 3


[hash]
salt = thelowcodebuilder-isso-salt-change-this
algorithm = pbkdf2
