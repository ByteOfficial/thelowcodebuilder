{{- /* Cusdis Comments — lightweight, no-login-required commenting */ -}}

<div class="comments-section">
  <h2 class="comments-heading">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    Comments
  </h2>
  <p class="comments-subtext">No sign-in required — just leave your name and comment!</p>

  <div id="cusdis_thread"
    data-host="https://cusdis.com"
    data-app-id="a8596ce5-38a0-4435-abcd-7244feba04d8"
    data-page-id="{{ .RelPermalink }}"
    data-page-url="{{ .Permalink }}"
    data-page-title="{{ .Title }}"
  ></div>
</div>

{{- /* Set correct theme BEFORE Cusdis loads */ -}}
<script>
(function() {
  var theme = localStorage.getItem("pref-theme");
  if (!theme) {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.getElementById("cusdis_thread").setAttribute("data-theme", theme);
})();
</script>

{{- /* Load Cusdis SDK */ -}}
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>

<style>
  #cusdis_thread iframe {
    width: 100% !important;
    border: none !important;
  }
  /* Hide "Comments powered by Cusdis" link */
  #cusdis_thread > a {
    display: none !important;
  }
</style>

<script>
  // Remove scrollbar from Cusdis iframe and auto-resize to fit content
  (function() {
    var container = document.getElementById("cusdis_thread");
    if (!container) return;

    function setupIframe(iframe) {
      // Remove scrollbar
      iframe.setAttribute("scrolling", "no");
      iframe.style.border = "none";

      // Auto-resize: poll the iframe for size changes via Cusdis postMessage
      // Also set a generous initial height so comments aren't cut off
      iframe.style.minHeight = "500px";
    }

    // Watch for Cusdis to inject the iframe
    var observer = new MutationObserver(function(mutations) {
      var iframe = container.querySelector("iframe");
      if (iframe) {
        setupIframe(iframe);
        observer.disconnect();
      }
    });
    observer.observe(container, { childList: true, subtree: true });

    // Listen for Cusdis resize messages to auto-adjust height
    window.addEventListener("message", function(e) {
      try {
        var data = typeof e.data === "string" ? JSON.parse(e.data) : e.data;
        if (data && data.from === "cusdis" && data.event === "resize") {
          var iframe = container.querySelector("iframe");
          if (iframe) {
            // Add some padding to avoid clipping
            iframe.style.height = (parseInt(data.data, 10) + 20) + "px";
          }
        }
      } catch (_) {}
    });
  })();
</script>

<script>
  // ── Theme sync with PaperMod toggle ──
  function getCusdisTheme() {
    var stored = localStorage.getItem("pref-theme");
    if (stored) return stored;
    return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }

  // Hook into PaperMod's localStorage write to catch theme changes
  (function () {
    var origSetItem = localStorage.setItem;
    localStorage.setItem = function (key, value) {
      origSetItem.apply(this, arguments);
      if (key === "pref-theme") {
        var thread = document.getElementById("cusdis_thread");
        if (thread) thread.setAttribute("data-theme", value);
        if (window.CUSDIS) {
          window.CUSDIS.setTheme(value);
        }
      }
    };
  })();

  // Also hook the toggle button as a backup
  document.addEventListener("DOMContentLoaded", function () {
    var toggle = document.getElementById("theme-toggle");
    if (toggle) {
      toggle.addEventListener("click", function () {
        setTimeout(function () {
          var theme = getCusdisTheme();
          var thread = document.getElementById("cusdis_thread");
          if (thread) thread.setAttribute("data-theme", theme);
          if (window.CUSDIS) {
            window.CUSDIS.setTheme(theme);
          }
        }, 250);
      });
    }
  });
</script>
