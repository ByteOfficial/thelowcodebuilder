{{ define "main" }}

<article class="post-single">
  <header class="post-header">
    {{ if .Title }}
    <h1 class="post-title">
      {{ .Title }}
    </h1>
    {{ end }}
    {{ if .Params.description }}
    <div class="post-description">
      {{ .Params.description }}
    </div>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>

<style>
  .post-single {
    max-width: 800px;
    margin: 0 auto;
  }

  .post-header {
    margin-bottom: 2rem;
  }

  .post-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .post-description {
    font-size: 1.1rem;
    opacity: 0.8;
    margin-bottom: 1.5rem;
  }

  .post-content {
    line-height: 1.8;
  }

  @media (max-width: 768px) {
    .post-title {
      font-size: 1.8rem;
    }
  }
</style>

{{ end }}
