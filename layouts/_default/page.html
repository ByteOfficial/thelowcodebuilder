{{ define "main" }}

<article class="page-single">
  <header class="page-header">
    {{ if .Title }}
    <h1 class="page-title">
      {{ .Title }}
    </h1>
    {{ end }}
    {{ if .Params.description }}
    <div class="page-description">
      {{ .Params.description }}
    </div>
    {{ end }}
  </header>
  <div class="page-content">
    {{ .Content }}
  </div>
</article>

<style>
  .page-single {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 0;
  }

  .page-header {
    margin-bottom: 2rem;
    text-align: center;
  }

  .page-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .page-description {
    font-size: 1.1rem;
    opacity: 0.8;
    margin-bottom: 1.5rem;
  }

  .page-content {
    line-height: 1.8;
  }

  @media (max-width: 768px) {
    .page-title {
      font-size: 1.8rem;
    }
    
    .page-single {
      padding: 1rem 0;
    }
  }
</style>

{{ end }}
